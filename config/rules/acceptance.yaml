# Правила приёмки актов советом МКД.
# Каждое правило ссылается на источник. kind:
#   norm           — прямо следует из нормативного акта;
#   calculation    — расчёт сервиса на основе норм;
#   recommendation — рекомендация сервиса, не норма;
#   assumption     — допущение, которое нужно сверить (показывается пользователю как допущение).
# Пункт акта (point) указывается только после сверки с первоисточником; до этого — null,
# и в документах ссылка идёт на акт целиком.

