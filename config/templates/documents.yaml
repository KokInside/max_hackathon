# Тексты документов (Go text/template). Вёрстку делает internal/pdf, здесь только слова.
# Правовые формулировки не проверены юристом — это указано в сообщении бота, которое сопровождает файл.

common:
  from: |
    от председателя совета многоквартирного дома по адресу: {{.Address}}
    {{.CustomerName}}{{if .Apartment}}, собственника квартиры № {{.Apartment}}{{end}}{{if .Authority}},
    действующего на основании {{.Authority}}{{end}}
  to: "{{.ExecutorName}}"
  signature: "Председатель совета многоквартирного дома"
  demo_watermark: "ДЕМО — синтетические данные"
  footer: "Сформировано сервисом «Приёмка» {{.Generated}} · правила версии {{.RulesVersion}}"

cover_letter:
  title: "Сопроводительное письмо"
  subject: "о направлении подписанного экземпляра акта № {{.Number}} от {{.ActDate}}"
  body:
    - "Направляем подписанный со стороны собственников помещений экземпляр акта приёмки оказанных услуг и (или) выполненных работ по содержанию и текущему ремонту общего имущества в многоквартирном доме № {{.Number}} от {{.ActDate}} за период с {{.PeriodFrom}} по {{.PeriodTo}} на сумму {{.Total}} руб."
    - "Акт получен {{.Received}}{{if .Channel}} ({{.Channel}}){{end}} и рассмотрен в порядке, утверждённом {{.CiteShort}}."
  attachments: "Приложение: акт № {{.Number}} от {{.ActDate}} — 1 экз."

refusal:
  title: "Мотивированный отказ от подписания акта"
  subject: "приёмки оказанных услуг и (или) выполненных работ по содержанию и текущему ремонту общего имущества в многоквартирном доме № {{.Number}} от {{.ActDate}} за период с {{.PeriodFrom}} по {{.PeriodTo}}"
  intro:
    - "Акт № {{.Number}} от {{.ActDate}} на сумму {{.Total}} руб. получен {{.Received}}{{if .Channel}} ({{.Channel}}){{end}}."
    - "В соответствии с порядком, утверждённым {{.CiteShort}}, направляем письменный обоснованный отказ от его подписания со стороны собственников помещений. Подтвердить пункты 3 и 4 акта («работы выполнены полностью, в установленные сроки, с надлежащим качеством», «претензий стороны друг к другу не имеют») собственники не могут по следующим основаниям."
  violations_heading: "1. Нарушения порядка оформления и направления акта"
  objections_heading: "{{if .HasViolations}}2{{else}}1{{end}}. Возражения по строкам акта"
  objections_columns: ["№", "Работа (услуга)", "Ед. изм.", "Цена по акту, руб.", "Оценка", "Возражение", "Доказ.", "Жильцы: было / не было / не знают"]
  full_objections_heading: "Возражения полностью"
  disputed_total: "Оспаривается: {{.Disputed}} руб. из {{.LinesTotal}} руб. по строкам акта ({{.DisputedCount}} поз.)."
  mismatch: "Сумма строк таблицы ({{.LinesTotal}} руб.) не совпадает с итогом в п. 2 акта ({{.Total}} руб.)."
  residents_note: "Ответы жильцов собраны через сервис «Приёмка»: ответили {{.Respondents}} чел. Сведения жильцов приведены в обобщённом виде, без персональных данных, и сервисом не проверялись."
  requests_heading: "{{.RequestsNo}}. Предложения"
  requests:
    - "Оформить новый акт с учётом изложенных возражений по тем же правилам."
    - "До оформления нового акта провести согласительное совещание и совместный осмотр общего имущества многоквартирного дома по оспариваемым позициям."
  evidence_heading: "Перечень доказательств"
  evidence_empty: "Доказательства в виде файлов не прилагаются."
