# Тексты сообщений бота, которые зависят от правил (напоминания, сводка сроков).
# Синтаксис — Go text/template. Поля: .Act (Number, Address), .Received, .ResponseOn, .SilentOn,
# .DaysLeftResponse, .DaysLeftSilent, .ResponseDays, .SilentDays, .CountingNextDay, .Cite (ссылка на порядок),
# .Demo (строка про демо-режим или пусто). Функция plural: {{plural N "день" "дня" "дней"}}.

remind_3_days_left: |
  ⏳ Акт № {{.Act.Number}} ({{.Act.Address}}): до конца срока ответа {{plural .DaysLeftResponse "остался" "осталось" "осталось"}} {{.DaysLeftResponse}} {{plural .DaysLeftResponse "день" "дня" "дней"}} — ответить нужно до {{.ResponseOn}} включительно.
  Проверьте строки и соберите подтверждения жильцов.{{.Demo}}
remind_tomorrow_last: |
  ⚠️ Акт № {{.Act.Number}}: завтра, {{.ResponseOn}}, последний день для ответа исполнителю — подписанный экземпляр или обоснованный отказ.{{.Demo}}
remind_today_last: |
  ‼️ Акт № {{.Act.Number}}: сегодня, {{.ResponseOn}}, последний день {{.ResponseDays}}-дневного срока ответа.{{.Demo}}
remind_response_overdue: |
  {{.ResponseDays}}-дневный срок ответа по акту № {{.Act.Number}} истёк {{.ResponseOn}}.
  Рекомендация сервиса: направьте ответ как можно скорее. Последствия ответа после {{.ResponseDays}}-го дня порядком прямо не описаны.
  Если до {{.SilentOn}} включительно исполнитель не получит ни подписанного акта, ни отказа, акт будет считаться оформленным со стороны совета.{{.Demo}}
remind_silent_soon: |
  Акт № {{.Act.Number}}: если до {{.SilentOn}} включительно исполнитель не получит ни подписанного акта, ни отказа, акт будет считаться оформленным без вашего ответа. {{plural .DaysLeftSilent "Остался" "Осталось" "Осталось"}} {{.DaysLeftSilent}} {{plural .DaysLeftSilent "день" "дня" "дней"}}.{{.Demo}}
remind_silent_tomorrow: |
  ‼️ Акт № {{.Act.Number}}: сегодня, {{.SilentOn}}, последний день. Если исполнитель не получит ни подписанного акта, ни отказа, завтра акт будет считаться оформленным со стороны совета.{{.Demo}}
silent_acceptance_happened: |
  Прошло {{.SilentDays}} дней со дня получения акта № {{.Act.Number}}, ответ исполнителю не отмечен. Акт считается оформленным со стороны совета ({{.Cite}}).
  Акт закрыт для изменений.{{.Demo}}

deadlines_summary: |
  📄 Акт № {{if .Act.Number}}{{.Act.Number}}{{else}}(номер не указан){{end}}, получен {{.Received}}.

  • Ответить исполнителю до {{.ResponseOn}} включительно ({{.ResponseDays}}-й день): вернуть подписанный экземпляр или направить обоснованный отказ.
  • Если до {{.SilentOn}} включительно ({{.SilentDays}}-й день) исполнитель не получит ни подписанного акта, ни отказа, акт будет считаться оформленным со стороны совета.
  Основание: {{.Cite}}. Дни считаются календарными, {{if .CountingNextDay}}со дня, следующего за днём получения{{else}}начиная с дня получения{{end}} (допущение).
